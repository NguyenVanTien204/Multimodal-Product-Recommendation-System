# H&M Personalized Fashion Recommendations — BẢNG THAM CHIẾU tham số (cập nhật 2026-10-05, phiên bản v2).
#
# QUAN TRỌNG: các notebook notebooks/hm/00..03 KHÔNG đọc file này; chúng đọc biến môi trường HM_*
# (danh sách và ý nghĩa: docs/hm/04_notebook_guide.md, mục 4). File này chỉ ghi lại giá trị mặc định thực sự được dùng
# để các tham số của luận văn có một nơi tra cứu duy nhất. Khi đổi mặc định trong notebook, đổi cả ở đây
# và ở docs/hm/02_methods.md, mục 9.
# Không ảnh hưởng tới artifact Amazon/Coveo.
project:
  dataset: "H&M Personalized Fashion Recommendations"
  dataset_version: "hm_v1"
  profile: "quick"            # quick: 50k khách (đã chạy); full: 300k khách (chưa chạy)
  seed: 20260922

paths:
  prepared_data: "/kaggle/input/datasets/hoho0111/hm-dataset-filled"   # HM_DATA_DIR
  retrieval_out: "/kaggle/working/hm_retrieval"                       # HM_OUTPUT_DIR (02) / HM_RETRIEVAL_DIR (03)
  rerank_out: "/kaggle/working/hm_reranking"                          # HM_RERANK_DIR
  export_out: "/kaggle/working/hm_export"                             # HM_EXPORT_DIR
  global_item_stats: "<prepared_data>/item_daily_counts.parquet"      # HM_GLOBAL_STATS (xuất bởi notebook 00)

sampling:                     # notebook 00
  quick_customers: 50000
  full_customers: 300000
  min_train_events: 3
  max_events_per_customer: 100   # chỉ cắt lịch sử cũ của cửa sổ train
  window_days: 7                 # selection / valid / test liên tiếp, lùi từ ngày cuối (2020-09-22)

embeddings:                   # notebook 01
  model: "jinaai/jina-clip-v2"
  dim: 512
  dtype: float32
  text_batch_size: 64
  image_batch_size: 16

retrieval:                    # notebook 02
  max_seq_len: 30
  d_model: 128
  batch_size: 512
  epochs_quick: 8
  epochs_full: 20
  early_stopping_patience: 3
  negatives: 128
  negative_distribution: "popularity^0.75"   # HM_UNIFORM_NEG_RATIO = 0.0
  temperature: 0.07
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 5
  id_dropout: 0.3
  id_gate_init: -2.0
  cold_fix_thresholds: [0, 1, 2, 3, 5, 10]  # 0 = tắt; quét trên cửa sổ selection
  refit: true
  serving_rule:                              # quét trên cửa sổ valid bằng Recall@100
    active_days: [0, 14, 28]
    cold_bonus: [0, 0.05, 0.1, 0.2]
    pop_weight: [0, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5]
    chosen_in_final_run: {active_days: 0, cold_bonus: 0.2, pop_weight: 0.1}

candidates:                   # notebook 03
  tower_k: 500
  recent_k: 200
  repeat_k: 100
  new_arrivals_k: 100
  new_arrivals_days: 28
  content_k: 200
  popular_k: 100
  cold_k: 100
  cold_prior_days: 56
  cold_prior_topk: 10
  cold_user_weight: 0.5
  cold_profile_items: 10

reranker:                     # notebook 03
  library: lightgbm
  objective: lambdarank
  ndcg_eval_at: 12
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  early_stopping_rounds: 60
  max_rounds: 1500
  refit_rounds_factor: 1.1
  feature_count: 24
  cold_slot_every: [0, 10, 5]

evaluation:
  ks: [12, 50, 100]
  sampled_negatives: 99
  sampled_strategies: [uniform, popularity]
  paired_bootstrap_resamples: 2000
