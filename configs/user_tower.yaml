data:
  items_path: data/items.parquet
  train_path: data/train.parquet
  valid_path: data/valid.parquet
  test_path: data/test.parquet
  artifacts_dir: data/artifacts/user_tower

model:
  d_model: 128
  n_heads: 4
  n_layers: 2
  d_ff: 512
  dropout: 0.2
  max_seq_len: 20 # p99 train length is well below this; see docs/user_tower_design.md

train:
  batch_size: 256
  epochs: 200
  lr: 0.0005
  weight_decay: 0.0001
  num_negatives: 4
  patience: 20
  eval_every: 5
  grad_clip_norm: 5.0
  seed: 20260813
  device: auto # auto | cpu | cuda

eval:
  ks: [10, 20, 50]
  batch_size: 512
  exclude_seen: true

content:
  # Empty enabled -> pure ID-based "Collaborative" baseline row.
  # ["image"] -> CF + Image
  # ["text"] -> CF + Text
  # ["image", "text"] -> Full Multimodal
  enabled: [image, text]
  sources:
    - name: image
      embeddings_path: data/embedding/image_embeddings.npy
      metadata_path: data/embedding/image_embedding_metadata.parquet
    - name: text
      embeddings_path: data/embedding/text_embeddings.npy
      metadata_path: data/embedding/text_embedding_metadata.parquet
