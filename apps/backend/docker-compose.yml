services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_market}
      POSTGRES_USER: ${POSTGRES_USER:-mini_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:6333/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mini_market}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mini_market}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      QDRANT_URL: http://qdrant:6333
      DATN_RECOMMENDER_URL: ${DATN_RECOMMENDER_URL:-http://recommender:8100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  # Retrieval (User Tower) + reranking model service. Reads training artifacts
  # and Parquet directly (allowed here, unlike in `api`; see docs/web/06-frontend-architecture.md
  # section 1) and is called by `api` over HTTP -- it never touches PostgreSQL/Qdrant.
  recommender:
    build:
      context: ../..
      dockerfile: apps/recommender/Dockerfile
    environment:
      DATN_DATA_DIR: /data
      DATN_DEVICE: ${RECOMMENDER_DEVICE:-cpu}
    volumes:
      - ../../data:/data:ro
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8100/health | grep -q '\"model_loaded\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  qdrant_data:
