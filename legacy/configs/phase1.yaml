paths:
  reviews: data/raw/Clothing_Shoes_and_Jewelry.jsonl.gz
  metadata: data/raw/meta_Clothing_Shoes_and_Jewelry.jsonl.gz
  interactions_output: data/interim/interactions_raw.parquet
  items_output: data/interim/items_raw.parquet
  report: data_report.md

resources:
  # null = calculate from currently available RAM. A value is only an upper bound.
  max_memory_gb: null
  available_fraction: 0.50
  total_fraction: 0.25
  reserve_gb: 2.0
  min_budget_mb: 64
  min_batch_rows: 1000
  max_batch_rows: 50000
  initial_batch_rows: 10000
  parquet_compression: zstd

pipeline:
  strict_schema: false
  overwrite: false
  keep_temporary_parts: false
