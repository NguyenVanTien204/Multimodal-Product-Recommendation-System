[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-recommender"
version = "0.1.0"
description = "Resource-aware data pipeline for the DATN multimodal recommender"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "polars>=1.20,<2",
  "psutil>=5.9,<8",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
datn-data = "datn.data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
