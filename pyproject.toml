[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-recommender"
version = "0.1.0"
description = "Resource-aware data pipeline for the DATN multimodal recommender"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "polars>=1.20,<2",
  "psutil>=5.9,<8",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23"]
vectordb = ["qdrant-client>=1.12,<1.13", "numpy>=1.26,<3"]
recommenders = ["torch>=2.2,<3", "numpy>=1.26,<3"]
rag = [
  "qdrant-client>=1.12,<1.13",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
  "torch>=2.2,<3",
  "transformers>=4.44,<4.50",
  "einops>=0.8",
  "timm>=1.0",
  "pillow>=10,<12",
  "psycopg[binary]>=3.1,<4",
]
coveo = ["torch>=2.2,<3", "numpy>=1.26,<3", "jupyter>=1.0,<2", "matplotlib>=3.8,<4"]

[project.scripts]
datn-data = "datn.data.cli:main"
datn-balanced-data = "datn.data.balanced_cli:main"
datn-vectordb = "datn.vectordb.cli:main"
datn-retrieval = "datn.retrieval.cli:main"
datn-eval-retrieval = "datn.evaluation.retrieval_eval:main"
datn-user-tower = "datn.recommenders.user_tower.cli:main"
datn-checkpoint = "datn.experiments.checkpoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
